name: Publish NuGet package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -creplace '^v', ''
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Use a release tag such as v1.0.0 or v1.0.0-rc.1."
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore Development/Gurux.DLMS.UI.Components.csproj

      - name: Pack release
        run: >-
          dotnet pack Development/Gurux.DLMS.UI.Components.csproj
          --configuration Release --no-restore
          --output artifacts
          -p:Version=$env:PACKAGE_VERSION
          -p:ContinuousIntegrationBuild=true

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "Configure the NUGET_API_KEY repository secret before publishing."
          }
          dotnet nuget push "artifacts/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
